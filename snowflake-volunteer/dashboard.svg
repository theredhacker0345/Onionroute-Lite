<svg xmlns="http://www.w3.org/2000/svg" width="820" height="280" viewBox="0 0 820 280" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#0D0D0D"/>
<stop offset="100%" stop-color="#080808"/>
</linearGradient>
<linearGradient id="barActive" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#00E5C4"/>
<stop offset="100%" stop-color="#006B5A"/>
</linearGradient>
<linearGradient id="barIdle" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#1A3A35"/>
<stop offset="100%" stop-color="#0D1F1C"/>
</linearGradient>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
<feGaussianBlur stdDeviation="3" result="blur"/>
<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect width="820" height="280" fill="url(#bg)" rx="8"/>
<circle cx="20" cy="20" r="4" fill="#00E5C4">
<animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
</circle>
<text x="30" y="24" fill="#00E5C4" font-size="11" font-weight="600" letter-spacing="1.5">LIVE</text>
<text x="55" y="24" fill="#E0E0E0" font-size="14" font-weight="700">Snowflake Volunteer Dashboard</text>
<text x="795" y="24" fill="#888888" font-size="11" text-anchor="end" font-weight="500">3 sessions  ·  0 helped  ·  5h 55m donated</text>
<line x1="55" y1="38" x2="795" y2="38" stroke="#1A1A1A" stroke-width="1"/>
<text x="55" y="55" fill="#555555" font-size="10">Session duration (minutes) — green bars indicate sessions where censored users connected</text>
<line x1="55" y1="230.0" x2="795" y2="230.0" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="3,4"/>
<text x="47" y="234.0" fill="#555555" font-size="9" text-anchor="end">0m</text>
<line x1="55" y1="190.0" x2="795" y2="190.0" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="3,4"/>
<text x="47" y="194.0" fill="#555555" font-size="9" text-anchor="end">87m</text>
<line x1="55" y1="150.0" x2="795" y2="150.0" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="3,4"/>
<text x="47" y="154.0" fill="#555555" font-size="9" text-anchor="end">175m</text>
<line x1="55" y1="110.0" x2="795" y2="110.0" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="3,4"/>
<text x="47" y="114.0" fill="#555555" font-size="9" text-anchor="end">262m</text>
<line x1="55" y1="70.0" x2="795" y2="70.0" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="3,4"/>
<text x="47" y="74.0" fill="#555555" font-size="9" text-anchor="end">350m</text>
<rect x="98.2" y="229.1" width="160.3" height="3.0" fill="url(#barIdle)" rx="3"/>
<text x="178.3" y="262" fill="#555555" font-size="9" text-anchor="middle">06-18</text>
<rect x="344.8" y="70.0" width="160.3" height="160.0" fill="url(#barIdle)" rx="3"/>
<text x="425.0" y="85.0" fill="#3A5A55" font-size="9" text-anchor="middle" font-weight="600">350m</text>
<rect x="591.5" y="228.6" width="160.3" height="3.0" fill="url(#barIdle)" rx="3"/>
<text x="671.7" y="262" fill="#555555" font-size="9" text-anchor="middle">06-19</text>
<text x="410" y="275" fill="#888888" font-size="10" text-anchor="middle" font-style="italic">Armed & monitoring — 3 sessions completed, awaiting first client</text>
</svg>