# ── Build Configuration ───────────────────────────────────────
# F-Droid builds a SINGLE UNIVERSAL APK containing all 4 ABIs.
# The fdroid flavor disables ABI splits in build.gradle so
# assembleFdroidRelease produces one universal APK.
#
# IMPORTANT: commit must be a full 40-char SHA hash, NOT a tag.
# Run: git rev-parse HEAD   to get the current hash.
# F-Droid will NOT accept tags in the commit field.

Builds:
  - versionName: '1.0.0'
    versionCode: 1000
    commit: f62c42c2fd18e5013b43a26ea2f4589a71324abb
    subdir: app
    gradle:
      - fdroid
    ndk: r26d
    prebuild:
      - chmod +x ../scripts/build-all.sh
      - chmod +x ../scripts/build-tor.sh
      - chmod +x ../scripts/build-obfs4.sh
      - chmod +x ../scripts/build-snowflake.sh
      - chmod +x ../scripts/build-tun2socks.sh
      - cd ..
      # Build only ARM ABIs — x86/x86_64 are emulator-only and would
      # double the APK size. The fdroid flavor's ndk.abiFilters
      # ensures only these 2 ABIs are packaged even if others exist.
      - ./scripts/build-all.sh armeabi-v7a $$NDK$$
      - ./scripts/build-all.sh arm64-v8a $$NDK$$
    scanignore:
      - app/src/main/jniLibs/armeabi-v7a/libtor.so
      - app/src/main/jniLibs/armeabi-v7a/libobfs4proxy.so
      - app/src/main/jniLibs/armeabi-v7a/libsnowflake.so
      - app/src/main/jniLibs/armeabi-v7a/libsnowflake-proxy.so
      - app/src/main/jniLibs/armeabi-v7a/libtun2socks.so
      - app/src/main/jniLibs/arm64-v8a/libtor.so
      - app/src/main/jniLibs/arm64-v8a/libobfs4proxy.so
      - app/src/main/jniLibs/arm64-v8a/libsnowflake.so
      - app/src/main/jniLibs/arm64-v8a/libsnowflake-proxy.so
      - app/src/main/jniLibs/arm64-v8a/libtun2socks.so

MaintainerNotes: |
  Native binaries (libtor.so, libobfs4proxy.so, libsnowflake.so,
  libsnowflake-proxy.so, libtun2socks.so) are built from source during
  the F-Droid build process using the scripts in the scripts/ directory.

  The scanignore directive tells F-Droid's scanner to skip these
  pre-built binary paths since they are verified to be built from
  source during the build step.

  F-Droid builds a SINGLE UNIVERSAL APK containing only ARM ABIs
  (armeabi-v7a + arm64-v8a). x86 and x86_64 are intentionally excluded
  because they are emulator-only and would double the APK size (~42MB
  vs ~77MB) with no benefit to real Android users. ~99% of Android
  devices are ARM. The fdroid product flavor's ndk.abiFilters enforces
  this at packaging time.

  All dependencies are FOSS (Apache-2.0) from Maven Central and
  Google's Maven repository. No Google Play Services, Firebase,
  or tracking SDKs are used.

  Bundled fonts under SIL Open Font License 1.1:
  - Syne (OFL 1.1) by Lucas Descroix
  - JetBrains Mono (OFL 1.1) by Philipp Nurullin
  - DM Sans (OFL 1.1) by Colophon Foundry

  The app connects to the Tor network — a free, decentralized
  network run by volunteers running free software. The Tor network
  itself is free software infrastructure.

  Snowflake uses FOSS-only STUN servers (stun.antisip.com,
  stun.bluesip.net, stun.sipnet.cz). Google STUN servers are
  NOT included by default to avoid NonFreeNet AntiFeature.

  Kindness Mode (Snowflake proxy) uses the same FOSS STUN servers.

  WebTunnel bridges connect to Tor Project infrastructure via HTTPS.

  The app is NOT useless without Tor — it can still function as a
  local SOCKS5/HTTP proxy client for any SOCKS5 service.

  QUERY_ALL_PACKAGES permission: required by the per-app routing
  feature (AppSelectionManager.getInstalledApps). On Android 11+
  (API 30+), package visibility restrictions hide user-installed
  apps from this app unless QUERY_ALL_PACKAGES is declared or a
  <queries> filter matches. For a VPN app that routes per-app
  traffic, seeing all installed apps is essential. This permission
  is 'normal' protection level (auto-granted, no user prompt).

AntiFeatures:
  # NonFreeNet: The app connects to Tor bridges and STUN servers operated
  # by third parties. While the Tor Project and STUN providers run free
  # software, the network services themselves are not verifiable as
  # "free" by F-Droid's definition. Snowflake uses FOSS-friendly STUN
  # servers (stun.antisip.com, stun.bluesip.net, stun.sipnet.cz) and
  # avoids Google STUN servers.
  - NonFreeNet

