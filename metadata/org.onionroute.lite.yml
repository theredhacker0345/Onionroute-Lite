Summary: Lightweight Tor client with VPN, Snowflake and per-app routing

Description: |
  OnionRoute Lite is a minimal, lightweight Tor client for Android that
  provides VPN mode, SOCKS5/HTTP proxy, and censorship circumvention
  through Snowflake, obfs4 and WebTunnel bridges.

  Features:
  * One-tap Tor connect/disconnect
  * VPN mode: route all device traffic through Tor
  * Per-app routing: choose which apps go through Tor
  * SOCKS5 proxy on 127.0.0.1:9050
  * HTTP CONNECT proxy on 127.0.0.1:8118
  * Snowflake bridge for WebRTC-based censorship circumvention
  * obfs4 bridge support with built-in default bridges
  * WebTunnel bridge support (HTTPS-mimicking transport)
  * Custom bridge import via QR code scan or paste
  * .onion site access (automatic via Tor routing)
  * Real-time bandwidth monitoring with speed graph
  * Kill switch: block internet if Tor disconnects
  * Always-on VPN support
  * Quick Settings tiles for connection toggle and new circuit
  * Kindness Mode: run Snowflake proxy to help censored users
  * Camouflage: alternate launcher icons to disguise the app
  * Auto-start on boot (optional)

  Designed for low-end Android devices with minimal RAM and storage.
  Optimized for Android 6.0 (Marshmallow) and above. Supports
  armeabi-v7a, arm64-v8a, x86, and x86_64 devices.

  This app does NOT include:
  - Built-in browser (use Firefox with your Tor connection)
  - Root mode or iptables manipulation
  - Proprietary analytics or tracking
  - Google Play Services dependency

