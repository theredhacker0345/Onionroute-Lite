# ══════════════════════════════════════════════════════════════
# Bridge Health Monitor — Pure Python, No AI
# ══════════════════════════════════════════════════════════════
# Every 15 minutes:
#   1. TCP-test all bridges in Constants.kt (5s each)
#   2. For dead bridges: fetch replacements from BridgeDB
#   3. TCP-test candidates
#   4. Swap dead for alive in Constants.kt
#   5. Write alive_bridges.json (fetched by the app at runtime)
#   6. Update README health table
#   7. Commit to main
#
# No AI, no llama.cpp, no 2GB model, no Tor install, no Go.
# Total runtime: ~2 min.
# ══════════════════════════════════════════════════════════════

name: Bridge Health

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bridge-health
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test all bridges (TCP check)
        run: |
          echo "=== Testing all bundled bridges ==="
          python3 bridge-health/test_bridges.py \
            --timeout 5 \
            --output bridge-health/current_results.json
          echo ""
          cat bridge-health/current_results.json

      - name: Check if swaps needed
        id: need_swap
        run: |
          python3 bridge-health/check_need_ai.py
          NEED=$(cat bridge-health/need_ai.txt)
          echo "need_swap=$NEED"
          echo "need_swap=$NEED" >> $GITHUB_OUTPUT

      - name: Fetch replacements + swap + commit to main
        if: steps.need_swap.outputs.need_swap == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # fetch_candidates.py does everything:
          # 1. Fetches bridges from BridgeDB (5 requests per transport)
          # 2. TCP-tests all candidates
          # 3. Makes deterministic swap decisions
          # 4. Writes decision.json
          python3 bridge-health/fetch_candidates.py

          # apply_changes.py executes the swaps + commits to main
          python3 bridge-health/apply_changes.py \
            bridge-health/decision.json \
            bridge-health/current_results.json \
            --apply --open-pr

      - name: No swaps needed — update health.json only
        if: steps.need_swap.outputs.need_swap != 'true'
        run: |
          python3 bridge-health/make_no_action_decision.py
          python3 bridge-health/apply_changes.py \
            bridge-health/decision.json \
            bridge-health/current_results.json

      - name: Write alive_bridges.json (always)
        run: |
          python3 bridge-health/write_alive_bridges.py
          echo ""
          echo "=== alive_bridges.json ==="
          cat bridge-health/alive_bridges.json

      - name: Update README health table
        run: |
          python3 bridge-health/render_readme.py

      - name: Commit to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Reconfigure remote with GITHUB_TOKEN
          repo="${{ github.repository }}"
          token="${{ secrets.GITHUB_TOKEN }}"
          git remote set-url origin "https://x-access-token:${token}@github.com/${repo}.git"

          git add bridge-health/health.json \
                 bridge-health/alive_bridges.json \
                 README.md

          # Also add Constants.kt if it was modified by a swap
          git add app/src/main/java/org/onionroute/lite/Constants.kt 2>/dev/null || true

          # NOTE: current_results.json, candidates.json, decision.json,
          # health_data.json, need_ai.txt are gitignored (CI artifacts
          # regenerated each run). Don't try to add them.

          if git diff --cached --quiet; then
            echo "[*] No changes to commit"
          else
            ALIVE=$(python3 bridge-health/get_stat.py alive)
            TOTAL=$(python3 bridge-health/get_stat.py total)
            git commit -m "chore(bridges): health check — ${ALIVE}/${TOTAL} alive

          Auto-generated by .github/workflows/bridge-health.yml"

            git pull --rebase origin main || true
            git push origin main
            echo "[*] Pushed to main"
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Bridge Health Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python3 bridge-health/summary.py >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
