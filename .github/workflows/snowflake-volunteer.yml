# ══════════════════════════════════════════════════════════════
# Snowflake Volunteer — GitHub Actions as a Tor proxy
# ══════════════════════════════════════════════════════════════
#
# This workflow is UNUSUAL. It does not build, test, or deploy anything.
#
# Instead, it runs a real Tor Snowflake proxy on the GitHub Actions
# runner for ~5 hours 50 minutes per invocation, donating bandwidth
# to help people in censored countries (Iran, China, Russia, etc.)
# bypass censorship and reach the free internet.
#
# Every 6 hours (cron), a fresh runner:
#   1. Builds snowflake-proxy from source (Tor Project, Go)
#   2. Runs it for ~5h50m (just under the 6h job timeout)
#   3. Real censored users connect via WebRTC through our proxy
#   4. After the session, parses the log for contribution stats
#   5. Updates snowflake-volunteer/stats.json + regenerates SVG dashboard
#   6. Rewrites the README badge + stats table with new totals
#   7. Commits everything back to main
#
# Cost: $0. Public repos have unlimited Actions minutes.
# Value: Real human-rights contribution running 24/7 from this repo.
#
# Inspired by: https://snowflake.torproject.org/ — the Tor Project's
# browser-based volunteer proxy. We do the same thing but from CI.
# ══════════════════════════════════════════════════════════════

name: Snowflake Volunteer

on:
  schedule:
    # Every 6 hours at :00 UTC.
    # 6h gap = exactly 4 sessions/day = 24/7 coverage.
    # Each session runs ~5h50m, leaving a 10-min gap for the next cron.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Manual trigger — anyone with repo access can start a session
    # from the Actions tab to test or to contribute extra bandwidth.
    inputs:
      duration_minutes:
        description: 'Session duration in minutes (max 350, default 350)'
        required: false
        default: '350'

# Prevent concurrent sessions — only one volunteer at a time.
# If a new run starts while the previous is still going, the old one
# is cancelled. This avoids wasting Actions minutes on duplicate runs.
concurrency:
  group: snowflake-volunteer
  cancel-in-progress: false

jobs:
  volunteer:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6h hard cap (GitHub's max). We exit at 350.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false  # We only build one binary; cache adds overhead

      - name: Build snowflake-proxy from source
        # Builds the official Tor Project snowflake-proxy binary.
        # Source: gitlab.torproject.org/tpo/anti-censorship/pluggable-transports/snowflake/v2
        # Pinned to v2.10.1 for reproducibility.
        run: |
          echo "=== Building snowflake-proxy v2.10.1 ==="
          go install gitlab.torproject.org/tpo/anti-censorship/pluggable-transports/snowflake/v2/proxy@v2.10.1
          echo "=== Binary location ==="
          ls -lh "$(go env GOPATH)/bin/proxy"
          file "$(go env GOPATH)/bin/proxy"

      - name: Show runner info
        # Useful for the log — shows which GitHub runner geo we got.
        run: |
          echo "=== Runner info ==="
          echo "Hostname: $(hostname)"
          echo "Public IP (via Tor check):"
          curl -s --max-time 10 https://check.torproject.org/api/ip || echo "(check failed)"
          echo "Runner OS: $RUNNER_OS $RUNNER_ARCH"
          echo "Job started: ${{ github.event.repository.updated_at }}"

      - name: Run snowflake proxy
        # The core step. Runs the proxy with timeout so it exits cleanly
        # before the 6h job limit. Captures all output to proxy.log for
        # stats parsing. continue-on-error=true because timeout returns
        # non-zero exit code (124) which would fail the workflow.
        env:
          SESSION_MINUTES: ${{ github.event.inputs.duration_minutes || '350' }}
        run: |
          echo "=== Starting snowflake proxy for ${SESSION_MINUTES} minutes ==="
          echo "=== Real censored users may connect via WebRTC ==="
          echo ""
          # timeout exits with 124 when the time limit is hit — that's expected.
          # Use 'timeout --preserve-status' to keep the proxy's actual exit code.
          timeout --preserve-status "${SESSION_MINUTES}m" "$(go env GOPATH)/bin/proxy" \
            -broker https://snowflake-broker.torproject.net/ \
            -front cdn.sstatic.net \
            -ice stun:stun.antisip.com:3478,stun:stun.bluesip.net:3478,stun:stun.sipnet.cz:3478 \
            -relay wss://snowflake.bamsoftware.com/ \
            -log info \
            -capacity 5 \
            2>&1 | tee proxy.log
          EXIT=$?
          echo ""
          echo "=== Proxy session ended (exit $EXIT) ==="
          echo "=== 124 = timeout (normal), 0 = clean exit, other = error ==="
        continue-on-error: true

      - name: Calculate actual session duration
        id: duration
        # The proxy may have exited early (error) or hit the timeout.
        # Parse the log to find actual runtime, or fall back to the
        # requested duration.
        run: |
          # Try to find the first and last timestamp in the log
          if [ -f proxy.log ]; then
            FIRST_LINE=$(head -1 proxy.log 2>/dev/null || echo "")
            LAST_LINE=$(tail -1 proxy.log 2>/dev/null || echo "")
            echo "First log line: $FIRST_LINE"
            echo "Last log line: $LAST_LINE"
          fi
          # Use the requested duration as approximation
          SESSION_MINUTES=${{ github.event.inputs.duration_minutes || '350' }}
          DURATION_SECONDS=$((SESSION_MINUTES * 60))
          echo "duration_seconds=$DURATION_SECONDS" >> $GITHUB_OUTPUT
          echo "[*] Recorded duration: ${SESSION_MINUTES}m ($DURATION_SECONDS s)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Process stats + update README + generate SVG
        # Runs the Python script that:
        # 1. Parses proxy.log for clients_helped + bytes_relayed
        # 2. Appends to snowflake-volunteer/stats.json
        # 3. Regenerates snowflake-volunteer/dashboard.svg
        # 4. Rewrites the README's snowflake-volunteer section
        run: |
          python3 snowflake-volunteer/process_stats.py proxy.log ${{ steps.duration.outputs.duration_seconds }}

      - name: Show what changed
        # Helpful for the Actions log — shows the diff before committing.
        run: |
          echo "=== Git diff summary ==="
          git diff --stat || true
          echo ""
          echo "=== stats.json (last entry) ==="
          python3 -c "
          import json
          with open('snowflake-volunteer/stats.json') as f:
              stats = json.load(f)
          if stats:
              print(json.dumps(stats[-1], indent=2))
          else:
              print('(empty)')
          "
          echo ""
          echo "=== Dashboard SVG (first 5 lines) ==="
          head -5 snowflake-volunteer/dashboard.svg || echo "(no SVG)"

      - name: Commit stats + README back to main
        # The self-modifying part. The workflow commits its own output
        # back to the repo so the README badge stays live.
        # Uses github-actions[bot] as the commit author.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add snowflake-volunteer/stats.json \
                 snowflake-volunteer/dashboard.svg \
                 README.md

          if git diff --cached --quiet; then
            echo "[*] No changes to commit (stats may be identical to last run)"
          else
            # Extract this session's clients helped for the commit message
            CLIENTS=$(python3 -c "
            import json
            with open('snowflake-volunteer/stats.json') as f:
                stats = json.load(f)
            print(stats[-1]['clients_helped'] if stats else 0)
            ")
            TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M)
            git commit -m "chore(snowflake): volunteer session ${TIMESTAMP} — ${CLIENTS} clients helped

            Auto-generated by .github/workflows/snowflake-volunteer.yml
            This commit represents real bandwidth donated to censored users
            via the Tor Snowflake proxy running on this GitHub Actions runner."

            git push
            echo "[*] Pushed stats commit to main"
          fi

      - name: Summary
        # Shows in the Actions run summary page
        run: |
          echo "## Snowflake Volunteer Session Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This GitHub Actions runner volunteered as a Tor Snowflake proxy." >> $GITHUB_STEP_SUMMARY
          echo "Real censored users may have connected through it." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python3 -c "
          import json
          with open('snowflake-volunteer/stats.json') as f:
              stats = json.load(f)
          if stats:
              s = stats[-1]
              print(f'| Metric | Value |')
              print(f'|--------|-------|')
              print(f'| Session timestamp | {s[\"timestamp\"]} |')
              print(f'| Duration | {s[\"duration_seconds\"]}s |')
              print(f'| Clients helped | {s[\"clients_helped\"]} |')
              print(f'| Bytes relayed | {s[\"bytes_relayed\"]} |')
              print()
              total_clients = sum(x['clients_helped'] for x in stats)
              total_bytes = sum(x['bytes_relayed'] for x in stats)
              print(f'**All-time:** {len(stats)} sessions, {total_clients} people helped')
          " >> $GITHUB_STEP_SUMMARY
