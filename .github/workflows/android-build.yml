# ══════════════════════════════════════════════════════════════
# OnionRoute Lite — GitHub Actions CI/CD
# ══════════════════════════════════════════════════════════════
# Triggers:
#   - Push to main (fdroid debug APK build + lint)
#   - Pull request to main (fdroid debug APK build + lint)
#   - Tag push v* (fdroid release APK build + GitHub Release)
#
# Strategy:
#   - Native binaries (.so) are built from source using NDK + Go
#   - Debug job: builds x86_64 + armeabi-v7a for emulator + device testing
#   - If native build fails, APK is still built (without native libs)
#     so the app's error handling can be tested
#   - Release job: builds all 4 ABIs, fails if any native build fails
# ══════════════════════════════════════════════════════════════

name: Android Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  GO_VERSION: '1.21'

jobs:
  # ── Build F-Droid Debug APK ──────────────────────────────
  # Tries to build native binaries; if that fails, still
  # produces an APK so the UI/service layer can be tested.
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Resolve NDK path
        id: resolve-ndk
        run: |
          # nttld/setup-ndk@v1 sets ANDROID_NDK_HOME and outputs ndk-path
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          if [ -z "$NDK_PATH" ] || [ ! -d "$NDK_PATH" ]; then
            NDK_PATH="${ANDROID_NDK_HOME:-}"
          fi
          if [ -z "$NDK_PATH" ] || [ ! -d "$NDK_PATH" ]; then
            NDK_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | head -1)
          fi
          if [ -z "$NDK_PATH" ] || [ ! -d "$NDK_PATH" ]; then
            NDK_PATH=$(ls -d "$HOME"/android-ndk* 2>/dev/null | head -1)
          fi
          if [ -z "$NDK_PATH" ] || [ ! -d "$NDK_PATH" ]; then
            echo "WARNING: No NDK found"
            echo "ndk-path=" >> $GITHUB_OUTPUT
          else
            echo "Using NDK at: $NDK_PATH"
            echo "ndk-path=$NDK_PATH" >> $GITHUB_OUTPUT
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Grant execute permission for scripts
        run: |
          chmod +x gradlew
          chmod +x scripts/*.sh

      - name: Build native binaries (armeabi-v7a + x86_64)
        id: native-build
        run: |
          NDK_PATH="${{ steps.resolve-ndk.outputs.ndk-path }}"
          if [ -z "$NDK_PATH" ]; then
            echo "WARNING: No NDK found — skipping native binary build"
            echo "native_build_ok=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Using NDK at: $NDK_PATH"

          NATIVE_OK=true

          # Build armeabi-v7a (primary target device)
          echo ""
          echo "=== Building armeabi-v7a ==="
          ./scripts/build-all.sh armeabi-v7a "$NDK_PATH" || NATIVE_OK=false

          # Build x86_64 (for emulator testing)
          echo ""
          echo "=== Building x86_64 ==="
          ./scripts/build-all.sh x86_64 "$NDK_PATH" || NATIVE_OK=false

          if [ "$NATIVE_OK" = true ]; then
            echo "native_build_ok=true" >> $GITHUB_OUTPUT
            echo ""
            echo "All native binaries built successfully!"
          else
            echo "native_build_ok=false" >> $GITHUB_OUTPUT
            echo ""
            echo "WARNING: Some native binaries failed to build."
            echo "The APK will be built anyway so the UI can be tested."
            echo "The app will show an error when trying to connect to Tor."
          fi

      - name: Verify native binaries
        if: steps.native-build.outputs.native_build_ok == 'true'
        run: |
          for ABI in armeabi-v7a x86_64; do
            echo "Checking ${ABI} binaries..."
            for lib in libtor.so libobfs4proxy.so libsnowflake.so libtun2socks.so libsnowflake-proxy.so; do
              FILE="app/src/main/jniLibs/$ABI/$lib"
              if [ -f "$FILE" ]; then
                SIZE=$(stat -c%s "$FILE" 2>/dev/null || echo "0")
                echo "  $lib: $SIZE bytes"
              else
                echo "  $lib: MISSING"
              fi
            done
          done

      - name: Build F-Droid Debug APK
        run: ./gradlew assembleFdroidDebug --no-daemon --stacktrace

      - name: Report APK details
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          if [ -n "$APK" ]; then
            SIZE=$(stat -c%s "$APK" 2>/dev/null || stat -f%z "$APK" 2>/dev/null)
            echo "APK: $APK"
            echo "Size: $SIZE bytes ($(echo "scale=1; $SIZE / 1048576" | bc) MB)"

            # Check what native libs are inside
            echo ""
            echo "Native libraries in APK:"
            unzip -l "$APK" 'lib/*/*.so' 2>/dev/null || echo "  No native libs found in APK"
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: onionroute-lite-fdroid-debug
          path: app/build/outputs/apk/fdroid/debug/*.apk
          retention-days: 14

      - name: Run Lint
        run: ./gradlew lintFdroidDebug --no-daemon 2>&1 || true
        continue-on-error: true

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-fdroidDebug.html
          retention-days: 7

  # ── Build F-Droid Release APK (on tags only) ───────────────
  # This job MUST have all native binaries built successfully.
  # No fallback — if native build fails, no release APK.
  build-release:
    name: Build Release APK
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: build-debug

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Resolve NDK path
        id: resolve-ndk
        run: |
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          if [ -z "$NDK_PATH" ] || [ ! -d "$NDK_PATH" ]; then
            NDK_PATH="${ANDROID_NDK_HOME:-}"
          fi
          if [ -z "$NDK_PATH" ] || [ ! -d "$NDK_PATH" ]; then
            NDK_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | head -1)
          fi
          if [ -z "$NDK_PATH" ] || [ ! -d "$NDK_PATH" ]; then
            echo "ERROR: No NDK found"
            echo "ndk-path=" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "Using NDK at: $NDK_PATH"
            echo "ndk-path=$NDK_PATH" >> $GITHUB_OUTPUT
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for scripts
        run: |
          chmod +x gradlew
          chmod +x scripts/*.sh

      - name: Build native binaries for ALL ABIs
        run: |
          NDK_PATH="${{ steps.resolve-ndk.outputs.ndk-path }}"
          if [ -z "$NDK_PATH" ]; then
            echo "ERROR: No NDK path resolved"
            exit 1
          fi
          ./scripts/build-all.sh all "$NDK_PATH"

      - name: Verify all native binaries
        run: |
          FAILED=0
          for ABI in armeabi-v7a arm64-v8a x86 x86_64; do
            for lib in libtor.so libobfs4proxy.so libsnowflake.so libsnowflake-proxy.so libtun2socks.so; do
              FILE="app/src/main/jniLibs/$ABI/$lib"
              if [ ! -f "$FILE" ]; then
                echo "ERROR: Missing $ABI/$lib"
                FAILED=1
              else
                SIZE=$(stat -c%s "$FILE" 2>/dev/null || echo "0")
                if [ "$SIZE" -lt 1024 ]; then
                  echo "ERROR: $ABI/$lib is only $SIZE bytes (stub)"
                  FAILED=1
                else
                  echo "OK: $ABI/$lib ($SIZE bytes)"
                fi
              fi
            done
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "FATAL: Release build requires all native binaries."
            exit 1
          fi

      - name: Build F-Droid Release APK
        run: ./gradlew assembleFdroidRelease --no-daemon --stacktrace

      - name: Verify no DependencyInfoBlock
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "ERROR: No APK found"; exit 1; fi
          if unzip -l "$APK" | grep -q "META-INF/com.android.build/gradle-metadata"; then
            echo "ERROR: DependencyInfoBlock found in APK"
            exit 1
          else
            echo "OK: No DependencyInfoBlock in APK"
          fi

      - name: Report APK size
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          if [ -n "$APK" ]; then
            SIZE=$(stat -c%s "$APK" 2>/dev/null || stat -f%z "$APK" 2>/dev/null)
            echo "APK: $APK"
            echo "Size: $SIZE bytes ($(echo "scale=1; $SIZE / 1048576" | bc) MB)"
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: onionroute-lite-fdroid-release
          path: app/build/outputs/apk/fdroid/release/*.apk
          retention-days: 30

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: OnionRoute Lite ${{ steps.version.outputs.VERSION }}
          draft: true
          files: |
            app/build/outputs/apk/fdroid/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Emulator Test ─────────────────────────────────────────────
  # Installs the debug APK on an x86_64 emulator, launches the
  # app, and captures logcat. The logcat is uploaded as an
  # artifact so we can diagnose runtime issues without a physical
  # device or manual Colab setup.
  emulator-test:
    name: Emulator Test
    runs-on: ubuntu-latest
    needs: build-debug
    timeout-minutes: 30
    if: github.event_name == 'push'

    steps:
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: onionroute-lite-fdroid-debug
          path: apk/

      - name: Write emulator test script
        run: |
          # reactivecircus/android-emulator-runner@v2 runs each script line in a
          # SEPARATE /usr/bin/sh -c invocation, so shell variables set on one line
          # are NOT available on the next. To work around this, we write the entire
          # test as a single bash script and execute it as one command.
          cat > /tmp/emulator-test.sh << 'SCRIPT'
          #!/bin/bash
          set -uo pipefail

          echo "=== Emulator ready ==="

          # Find and install the APK
          APK=$(find apk/ -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found in apk/ directory"
            ls -la apk/ 2>/dev/null || true
            exit 1
          fi
          echo "Installing APK: $APK"
          adb install -r "$APK"

          # List native libs in the installed APK
          echo ""
          echo "=== Native libraries ==="
          adb shell pm path org.onionroute.lite
          NATIVE_DIR=$(adb shell pm path org.onionroute.lite | head -1 | sed 's/package://;s/\r//')
          echo "APK path: $NATIVE_DIR"
          adb shell ls -la "$(dirname $NATIVE_DIR)/lib/x86_64/" 2>/dev/null || echo "(no x86_64 lib dir found)"

          # Launch the app
          echo ""
          echo "=== Launching OnionRoute Lite ==="
          adb shell am start -n org.onionroute.lite/org.onionroute.lite.MainActivity
          sleep 5

          # Capture logcat for 45 seconds
          echo ""
          echo "=== Capturing logcat (45s) ==="
          adb logcat -c
          timeout 45 adb logcat -v time \
            -s "TorService:*" "TorProcessManager:*" "TorControlConnection:*" \
            "BandwidthTracker:*" "BridgeConfig:*" "KillSwitch:*" \
            "AndroidRuntime:E" "System.err:W" \
            2>/dev/null | tee /tmp/logcat.txt || true

          # Check for critical errors
          echo ""
          echo "=== Error analysis ==="
          ERRORS=0
          if grep -qi "FATAL EXCEPTION" /tmp/logcat.txt; then
            echo "CRITICAL: FATAL EXCEPTION found!"
            grep -A 20 "FATAL EXCEPTION" /tmp/logcat.txt
            ERRORS=1
          fi
          if grep -qi "Native binary NOT FOUND" /tmp/logcat.txt; then
            echo "CRITICAL: Missing native binary!"
            grep "NOT FOUND" /tmp/logcat.txt
            ERRORS=1
          fi
          if grep -qi "Exec format error" /tmp/logcat.txt; then
            echo "CRITICAL: Wrong architecture binary!"
            grep "format error" /tmp/logcat.txt
            ERRORS=1
          fi
          if grep -qi "Tor process exited" /tmp/logcat.txt; then
            echo "WARNING: Tor process crashed"
            grep "exited" /tmp/logcat.txt
          fi

          if [ "$ERRORS" -eq 0 ]; then
            echo "No critical errors detected."
          fi
          SCRIPT
          chmod +x /tmp/emulator-test.sh

      - name: Run Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4096M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash /tmp/emulator-test.sh

      - name: Upload Logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat
          path: /tmp/logcat.txt
          retention-days: 7

  # ── F-Droid Metadata Validation ─────────────────────────────
  validate-metadata:
    name: Validate F-Droid Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yq
        run: sudo snap install yq

      - name: Validate metadata YAML
        run: |
          echo "Checking metadata/org.onionroute.lite.yml..."
          yq eval '.' metadata/org.onionroute.lite.yml > /dev/null
          echo "YAML syntax: OK"

          for field in "Categories" "License" "AuthorName" "SourceCode" "Repo" "Summary" "Description"; do
            if [ -z "$(yq eval ".$field" metadata/org.onionroute.lite.yml)" ] || [ "$(yq eval ".$field" metadata/org.onionroute.lite.yml)" = "null" ]; then
              echo "ERROR: Missing required field: $field"
              exit 1
            fi
            echo "  $field: OK"
          done

          LICENSE=$(yq eval ".License" metadata/org.onionroute.lite.yml)
          echo "  License SPDX: $LICENSE"

          echo ""
          echo "Checking Fastlane metadata..."
          for file in fastlane/metadata/android/en-US/title.txt \
                      fastlane/metadata/android/en-US/short_description.txt \
                      fastlane/metadata/android/en-US/full_description.txt; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing $file"
              exit 1
            fi
            echo "  $(basename $file): OK ($(wc -c < $file) bytes)"
          done

          SHORT_DESC_LEN=$(wc -c < fastlane/metadata/android/en-US/short_description.txt)
          if [ "$SHORT_DESC_LEN" -gt 80 ]; then
            echo "WARNING: short_description.txt is $SHORT_DESC_LEN chars (F-Droid limit: 80)"
          else
            echo "  short_description length ($SHORT_DESC_LEN chars): OK"
          fi

          echo ""
          echo "All metadata checks passed!"

      - name: Check License file
        run: |
          if [ ! -f "LICENSE" ]; then
            echo "ERROR: LICENSE file not found"
            exit 1
          fi
          if ! grep -q "GNU GENERAL PUBLIC LICENSE" LICENSE && ! grep -q "GPL" LICENSE; then
            echo "WARNING: LICENSE may not be GPL-3.0"
          else
            echo "LICENSE: GPL-3.0 confirmed"
          fi
