# Project-wide Gradle settings

# JVM memory allocation — conservative for low-end build machines
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Non-transitive R classes
android.nonTransitiveRClass=true

# F-Droid reproducible build settings
org.gradle.caching=true
org.gradle.parallel=false

# Disable configuration cache for reproducibility
org.gradle.configuration-cache=false

# Disable build features that add non-determinism
android.enableJetifier=false

# R8 full mode — more aggressive shrinking & obfuscation.
# Reduces DEX size by removing unused code paths that basic R8 keeps.
# Safe for this app — no reflection used on app classes.
android.enableR8.fullMode=true
