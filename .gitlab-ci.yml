# Onionroute-Lite GitLab CI
#
# Pipelines may be created only from GitLab's Run pipeline page. Every job is
# optional and manual; none runs on pushes, merge requests, tags, triggers, or
# API/trigger events. Jobs never create releases. The manual Bridge Health job
# can commit only its generated bridge data and README section to protected main.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
    - when: never

stages:
  - build
  - diagnostics

variables:
  ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/.android-sdk"
  ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"
  ANDROID_NDK_HOME: "$CI_PROJECT_DIR/.android-sdk/ndk/26.3.11579264"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GO_VERSION: "1.21.13"
  NDK_VERSION: "26.3.11579264"

default:
  image: eclipse-temurin:17-jdk-jammy
  interruptible: true
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update -qq
    - apt-get install -y --no-install-recommends bash bc ca-certificates curl file git python3 python3-yaml unzip
    - mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
    - |
      if [ ! -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
        curl --fail --location --retry 3 --silent --show-error \
          --output /tmp/android-commandline-tools.zip \
          "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
        unzip -q /tmp/android-commandline-tools.zip -d /tmp/android-commandline-tools
        mv /tmp/android-commandline-tools/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
      fi
    - export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:/opt/go/bin:$PATH"
    - |
      # With pipefail enabled, `yes` receives SIGPIPE after sdkmanager accepts
      # the licenses and can incorrectly fail an otherwise successful install.
      set +o pipefail
      yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;$NDK_VERSION"
      sdkmanager_status=${PIPESTATUS[1]}
      set -o pipefail
      test "$sdkmanager_status" -eq 0
    - |
      if [ ! -x /opt/go/bin/go ]; then
        curl --fail --location --retry 3 --silent --show-error \
          --output /tmp/go.tar.gz \
          "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
        tar -C /opt -xzf /tmp/go.tar.gz
      fi
    - export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:/opt/go/bin:$PATH"
    - java -version
    - go version
    - test -x "$ANDROID_NDK_HOME/ndk-build"
    - chmod +x gradlew scripts/*.sh

android_verify:
  stage: build
  when: manual
  allow_failure: true
  timeout: 300m
  script:
    - |
      python3 - <<'PY'
      from pathlib import Path
      import yaml

      metadata_path = Path("metadata/org.onionroute.lite.yml")
      metadata = yaml.safe_load(metadata_path.read_text())
      required = ["Categories", "License", "AuthorName", "SourceCode", "Repo", "Summary", "Description"]
      missing = [field for field in required if not metadata.get(field)]
      if missing:
          raise SystemExit(f"Missing required metadata fields: {', '.join(missing)}")
      if not metadata["SourceCode"].startswith("https://gitlab.com/theredhacker0345/Onionroute-Lite"):
          raise SystemExit("SourceCode must use the GitLab canonical project URL")
      if not metadata["Repo"].endswith("Onionroute-Lite.git"):
          raise SystemExit("Repo must point to the GitLab clone URL")
      print("F-Droid metadata YAML and required fields: OK")
      PY
    - test -f LICENSE
    - grep -Eq "GNU GENERAL PUBLIC LICENSE|GPL" LICENSE
    - |
      for file in \
        fastlane/metadata/android/en-US/title.txt \
        fastlane/metadata/android/en-US/short_description.txt \
        fastlane/metadata/android/en-US/full_description.txt; do
        test -f "$file"
        printf '%s: OK (%s bytes)\n' "$file" "$(wc -c < "$file")"
      done
    - test "$(wc -c < fastlane/metadata/android/en-US/short_description.txt)" -le 80
    - ./scripts/build-all.sh armeabi-v7a "$ANDROID_NDK_HOME"
    - ./scripts/build-all.sh arm64-v8a "$ANDROID_NDK_HOME"
    - ./scripts/build-all.sh x86_64 "$ANDROID_NDK_HOME"
    - ./gradlew assembleFdroidDebug lintFdroidDebug assembleFdroidRelease --no-daemon --stacktrace
    - |
      for abi in armeabi-v7a arm64-v8a; do
        for library in libtor.so libobfs4proxy.so libsnowflake.so libsnowflake-proxy.so libtun2socks.so; do
          path="app/src/main/jniLibs/$abi/$library"
          test -f "$path"
          test "$(stat -c%s "$path")" -ge 1024
        done
      done
    - |
      debug_apk="$(find app/build/outputs/apk/fdroid/debug -name '*.apk' -print -quit)"
      release_apk="$(find app/build/outputs/apk/fdroid/release -name '*.apk' -print -quit)"
      test -n "$debug_apk"
      test -n "$release_apk"
      unzip -l "$debug_apk" 'lib/*/*.so'
      if unzip -l "$release_apk" | grep -q 'META-INF/com/android/build/gradle/dependencies-metadata'; then
        echo "DependencyInfoBlock detected in release APK" >&2
        exit 1
      fi
      printf 'Debug artifact: %s (%s bytes)\n' "$debug_apk" "$(stat -c%s "$debug_apk")"
      printf 'Release artifact: %s (%s bytes)\n' "$release_apk" "$(stat -c%s "$release_apk")"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - app/build/outputs/apk/fdroid/debug/*.apk
      - app/build/outputs/apk/fdroid/release/*.apk
      - app/build/reports/lint-results-fdroidDebug.html

bridge_health_diagnostics:
  image: python:3.12-slim
  stage: diagnostics
  when: manual
  allow_failure: true
  timeout: 15m
  resource_group: bridge-health-main
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update -qq
    - apt-get install -y --no-install-recommends git
  script:
    - mkdir -p bridge-health-artifacts
    - |
      test "$CI_COMMIT_BRANCH" = "main"
      test -n "${BRIDGE_WRITE_TOKEN:-}" || { echo "BRIDGE_WRITE_TOKEN is unavailable on this protected main pipeline" >&2; exit 1; }
      test -n "${BRIDGE_WRITE_USERNAME:-}" || { echo "BRIDGE_WRITE_USERNAME is unavailable on this protected main pipeline" >&2; exit 1; }
      python3 bridge-health/test_bridges.py --timeout 5 --output bridge-health/current_results.json
      python3 bridge-health/check_need_ai.py
      if [ "$(cat bridge-health/need_ai.txt)" = "true" ]; then
        python3 bridge-health/fetch_candidates.py
      else
        python3 bridge-health/make_no_action_decision.py
      fi
      python3 bridge-health/apply_changes.py bridge-health/decision.json bridge-health/current_results.json
      python3 bridge-health/write_alive_bridges.py --output bridge-health/alive_bridges.json
      python3 bridge-health/render_readme.py
      python3 bridge-health/summary.py > bridge-health-artifacts/summary.txt || true
      cp bridge-health/current_results.json bridge-health-artifacts/
      cp bridge-health/need_ai.txt bridge-health-artifacts/
      cp bridge-health/decision.json bridge-health-artifacts/
      cp bridge-health/alive_bridges.json bridge-health-artifacts/alive_bridges.committed.json
      cp bridge-health/health.json bridge-health-artifacts/health.committed.json
      test ! -f bridge-health/candidates.json || cp bridge-health/candidates.json bridge-health-artifacts/
      test ! -f bridge-health/health_data.json || cp bridge-health/health_data.json bridge-health-artifacts/
      git diff --check
      changed_files="$(git diff --name-only | LC_ALL=C sort)"
      expected_files="$(printf '%s\n' README.md bridge-health/alive_bridges.json bridge-health/health.json)"
      test "$changed_files" = "$expected_files" || { echo "Unexpected tracked-file change set:" >&2; printf '%s\n' "$changed_files" >&2; exit 1; }
      git add README.md bridge-health/alive_bridges.json bridge-health/health.json
      git config user.name "Onionroute Bridge Health Bot"
      git config user.email "bridge-health-bot@users.noreply.gitlab.com"
      git commit --no-verify -m "chore(bridges): update manual health check"
      cat > /tmp/bridge-health-askpass <<'EOF'
      #!/bin/sh
      case "$1" in
        *Username*) printf '%s\n' "$BRIDGE_WRITE_USERNAME" ;;
        *Password*) printf '%s\n' "$BRIDGE_WRITE_TOKEN" ;;
        *) exit 1 ;;
      esac
      EOF
      chmod 700 /tmp/bridge-health-askpass
      git remote set-url origin "https://${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      GIT_ASKPASS=/tmp/bridge-health-askpass GIT_TERMINAL_PROMPT=0 git push origin HEAD:main
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - bridge-health-artifacts/
